version: 2

# Bronze layer: source copies loaded by pipeline/extract_load.py (not built by dbt).
# This file only DESCRIBES those tables so silver models can select from them
# with {{ source('bronze', '<table>') }}.
sources:
  - name: bronze
    schema: bronze
    description: "Olist CSV files loaded as-is (all columns TEXT, plus _source_file and _loaded_at)."
    tables:
      - name: customers
        description: "One row per customer_id (a customer gets a new customer_id for every order)."
      - name: orders
        description: "One row per order, with status and lifecycle timestamps."
      - name: order_items
        description: "One row per item in an order."
      - name: order_payments
        description: "One row per payment; an order can be paid in several parts."
      - name: order_reviews
        description: "Customer reviews. One review_id can cover several orders (same review, 789 cases), so the key is review_id + order_id."
      - name: products
        description: "Product catalogue with Portuguese category names."
      - name: sellers
        description: "One row per seller."
      - name: category_translation
        description: "Portuguese to English category names (2 categories are missing)."
      - name: geolocation
        description: "Zip-code prefix coordinates (many rows per prefix)."
